name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_booking
          POSTGRES_USER: hotel_booking
          POSTGRES_PASSWORD: hotel_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_booking -d hotel_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: hotel_booking
      POSTGRES_PASSWORD: hotel_booking
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      CHECK_BOOKING_OVERLAPS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.4.2

      - name: Install dependencies
        run: poetry install

      - name: Check code style
        run: |
          poetry run ruff check src tests
          poetry run ruff format --check src tests

      - name: Check migration state
        run: poetry run python src/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run pytest --cov=src --cov-report=term-missing
